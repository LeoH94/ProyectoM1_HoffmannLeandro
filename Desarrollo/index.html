<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Colorfly Studio</title>
</head>
<body>
    
    <header>

        <div id="encabezado">
            <img id="colorflyLogo" src="../images/colorfly_logo.png" alt="Colorfly Studio"/>
            <h1>Generador de paleta de Colores</h1>
        </div>

        <div id="selector">
            <label>Cantidad de colores:
            <select id="cantidad">
                <option value="6">6</option>
                <option value="8">8</option>
                <option value="9">9</option>
            </select>
            </label>

            <label>Formato:
            <select id="formato">
                <option value="hex">HEX</option>
                <option value="hsl">HSL</option>
            </select>
            </label>

            <button id="generar">Generar paleta</button>
        </div>

        <div id="paleta"></div>

    </header>

    <main>

    </main>

    <footer>
         <p>&copy; 2026 - Hoffmann Leandro</p>
         <p>Todos los derechos reservados</p>    
    </footer>

    <script src="./app.js"></script>

</body>
</html>
